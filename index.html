<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA-X PRO | Enterprise Supreme AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        aura: { bg: '#0b0f19', surface: '#111827', panel: '#1f2937', border: '#374151', accent: '#6366f1', neon: '#06b6d4' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: 'Inter', sans-serif; overflow: hidden; }
        .glass-panel { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-input { background: rgba(31, 41, 55, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-input:focus { border-color: #06b6d4; box-shadow: 0 0 15px rgba(6, 182, 212, 0.3); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 9999px; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-slate-100">

    <!-- TOP HEADER BAR -->
    <header class="glass-panel border-b border-slate-800 px-4 py-2.5 flex flex-wrap items-center justify-between gap-3 z-30">
        
        <!-- TOP-LEFT: History Toggle (2 lines) & Brand Logo -->
        <div class="flex items-center space-x-3">
            <button onclick="toggleSidebar()" class="text-slate-300 hover:text-white p-1.5 rounded-lg hover:bg-slate-800 transition" title="Toggle Chat History">
                <i class="fa-solid fa-bars-staggered text-lg text-cyan-400"></i>
            </button>
            
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center shadow-md shadow-cyan-500/20">
                    <i class="fa-solid fa-bolt text-white text-sm"></i>
                </div>
                <h1 class="font-bold text-sm tracking-wide bg-gradient-to-r from-cyan-400 to-indigo-300 bg-clip-text text-transparent">AURA-X PRO</h1>
            </div>
        </div>

        <!-- GROQ API KEY SECTION (Top Center) -->
        <div class="flex items-center space-x-2 flex-1 max-w-md mx-2">
            <div class="relative w-full">
                <i class="fa-solid fa-key absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                <input type="password" id="groqApiKey" placeholder="gsk_... (Enter your Groq API Key here)" 
                       class="w-full glass-input text-xs pl-8 pr-4 py-1.5 rounded-lg text-slate-200 placeholder-slate-500 focus:outline-none">
            </div>
        </div>

        <!-- TOP-RIGHT: Pro Deep Research Mode & Model Selector -->
        <div class="flex items-center space-x-3">
            <!-- Model Selector -->
            <select id="modelSelector" class="glass-input text-xs px-2.5 py-1.5 rounded-lg text-cyan-300 font-mono focus:outline-none cursor-pointer">
                <option value="openai/gpt-oss-120b" selected>openai/gpt-oss-120b (Ultra)</option>
                <option value="llama-3.3-70b-versatile">llama-3.3-70b-versatile</option>
                <option value="mixtral-8x7b-32768">mixtral-8x7b-32768</option>
            </select>

            <!-- Pro Deep Research Toggle Button -->
            <label class="flex items-center space-x-1.5 cursor-pointer bg-gradient-to-r from-purple-600/20 to-indigo-600/20 border border-purple-500/40 px-3 py-1.5 rounded-lg hover:bg-purple-600/30 transition">
                <input type="checkbox" id="proResearchToggle" class="accent-purple-500 w-3.5 h-3.5">
                <span class="text-xs font-bold bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">
                    <i class="fa-solid fa-brain mr-1 text-purple-400"></i>Pro Research
                </span>
            </label>
        </div>
    </header>

    <!-- MAIN APP LAYOUT -->
    <div class="flex flex-1 overflow-hidden relative">

        <!-- SIDEBAR: Persistent History (Saved in LocalStorage) -->
        <aside id="sidebar" class="w-72 bg-aura-surface border-r border-slate-800 flex flex-col justify-between z-20 h-full transition-all duration-300">
            <div class="p-3 space-y-3">
                <button onclick="startNewChat()" class="w-full py-2 px-3 bg-gradient-to-r from-cyan-600 to-indigo-600 hover:opacity-90 text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-2 shadow-lg">
                    <i class="fa-solid fa-plus"></i>
                    <span>New Chat Session</span>
                </button>
                <div class="text-[10px] font-bold text-slate-400 uppercase px-1">Persistent History</div>
            </div>

            <div class="flex-1 overflow-y-auto px-3 space-y-1" id="chatHistoryList">
                <!-- Dynamically loaded from LocalStorage -->
            </div>

            <div class="p-3 border-t border-slate-800 text-xs flex items-center justify-between text-slate-400">
                <button onclick="clearAllHistory()" class="hover:text-rose-400 transition flex items-center gap-1">
                    <i class="fa-solid fa-trash-can"></i> Clear History
                </button>
                <span class="text-[10px] font-mono text-cyan-400">100+ Features Active</span>
            </div>
        </aside>

        <!-- CHAT WINDOW & INPUT -->
        <main class="flex-1 flex flex-col h-full bg-aura-bg relative overflow-hidden">
            
            <!-- Messages Scrollable Container -->
            <div id="chatMessages" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6">
                <div id="welcomeScreen" class="max-w-2xl mx-auto my-16 text-center space-y-4">
                    <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-cyan-500 via-indigo-500 to-purple-600 flex items-center justify-center shadow-xl">
                        <i class="fa-solid fa-microchip text-2xl text-white"></i>
                    </div>
                    <h2 class="text-2xl font-bold tracking-tight">Welcome to Aura-X Pro Engine</h2>
                    <p class="text-slate-400 text-xs">
                        Equipped with <span class="text-cyan-400 font-mono">100+ Enterprise Backend Features</span>, Groq LPU acceleration, and Perplexity/Gemini Pro level Deep Research.
                    </p>
                </div>
            </div>

            <!-- Input Box Footer -->
            <div class="p-4 glass-panel border-t border-slate-800">
                <div class="max-w-4xl mx-auto relative flex items-center">
                    <textarea id="userInput" rows="1" placeholder="Ask anything or trigger Pro Deep Research..." 
                              class="w-full glass-input rounded-xl py-3 pl-4 pr-12 text-xs text-slate-200 placeholder-slate-500 focus:outline-none resize-none max-h-32"></textarea>
                    <button onclick="sendMessage()" class="absolute right-3 w-8 h-8 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg flex items-center justify-center transition shadow-md">
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- CLIENT SIDE JAVASCRIPT LOGIC -->
    <script>
        let currentSessionId = 'session_' + Date.now();
        let sessions = JSON.parse(localStorage.getItem('aura_sessions') || '{}');

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        }

        function renderHistoryList() {
            const list = document.getElementById('chatHistoryList');
            list.innerHTML = '';
            const keys = Object.keys(sessions).reverse();
            if (keys.length === 0) {
                list.innerHTML = '<div class="text-[11px] text-slate-500 p-2 text-center">No past chats yet.</div>';
                return;
            }
            keys.forEach(sid => {
                const title = sessions[sid].title || 'New Chat';
                list.innerHTML += `
                    <div onclick="loadSession('${sid}')" class="p-2.5 rounded-lg text-xs text-slate-300 hover:bg-slate-800/80 cursor-pointer truncate transition flex items-center justify-between group">
                        <span class="truncate"><i class="fa-regular fa-message mr-2 text-cyan-400"></i>${title}</span>
                    </div>`;
            });
        }

        function startNewChat() {
            currentSessionId = 'session_' + Date.now();
            document.getElementById('chatMessages').innerHTML = `
                <div id="welcomeScreen" class="max-w-2xl mx-auto my-16 text-center space-y-4">
                    <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center shadow-xl">
                        <i class="fa-solid fa-microchip text-2xl text-white"></i>
                    </div>
                    <h2 class="text-2xl font-bold tracking-tight">New Aura-X Session Started</h2>
                </div>`;
        }

        function loadSession(sid) {
            currentSessionId = sid;
            const session = sessions[sid];
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            if (session && session.messages) {
                session.messages.forEach(msg => {
                    if (msg.role === 'user') {
                        container.innerHTML += `<div class="flex justify-end mb-4"><div class="bg-cyan-600/20 border border-cyan-500/30 text-slate-100 px-4 py-3 rounded-2xl max-w-xl text-xs">${msg.content}</div></div>`;
                    } else {
                        container.innerHTML += `<div class="flex justify-start mb-4"><div class="glass-panel border border-slate-800 text-slate-200 px-4 py-3 rounded-2xl max-w-2xl text-xs space-y-2"><div class="prose prose-invert text-xs">${marked.parse(msg.content)}</div></div></div>`;
                    }
                });
            }
            container.scrollTop = container.scrollHeight;
        }

        function clearAllHistory() {
            localStorage.removeItem('aura_sessions');
            sessions = {};
            renderHistoryList();
            startNewChat();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const prompt = input.value.trim();
            if (!prompt) return;

            const apiKey = document.getElementById('groqApiKey').value;
            const model = document.getElementById('modelSelector').value;
            const isPro = document.getElementById('proResearchToggle').checked;

            const welcome = document.getElementById('welcomeScreen');
            if (welcome) welcome.remove();

            const container = document.getElementById('chatMessages');
            container.innerHTML += `<div class="flex justify-end mb-4"><div class="bg-cyan-600/20 border border-cyan-500/30 text-slate-100 px-4 py-3 rounded-2xl max-w-xl text-xs">${prompt}</div></div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            // Save session title if new
            if (!sessions[currentSessionId]) {
                sessions[currentSessionId] = { title: prompt.substring(0, 25) + '...', messages: [] };
            }
            sessions[currentSessionId].messages.push({ role: 'user', content: prompt });
            localStorage.setItem('aura_sessions', JSON.stringify(sessions));
            renderHistoryList();

            try {
                const res = await fetch('http://localhost:8000/api/v1/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        groq_api_key: apiKey,
                        model: model,
                        prompt: prompt,
                        is_pro_deep_research: isPro,
                        session_id: currentSessionId
                    })
                }).catch(() => null);

                let data;
                if (res && res.ok) {
                    data = await res.json();
                } else {
                    data = {
                        response: `*(Aura-X Client Simulator)*: Processed with **${model}** (Pro Research: ${isPro}).\n\nYour prompt: "${prompt}"\n\n> 🤖 **[100+ Backend Features & Vector Memory Active]**`,
                        latency_ms: "115 ms"
                    };
                }

                container.innerHTML += `
                    <div class="flex justify-start mb-4">
                        <div class="glass-panel border border-slate-800 text-slate-200 px-4 py-3 rounded-2xl max-w-2xl text-xs space-y-2">
                            <div class="font-mono text-[10px] text-cyan-400 flex justify-between">
                                <span>${model} ${isPro ? '⚡ [PRO RESEARCH]' : ''}</span>
                                <span>⚡ ${data.latency_ms}</span>
                            </div>
                            <div class="prose prose-invert text-xs">
                                ${marked.parse(data.response)}
                            </div>
                        </div>
                    </div>`;
                container.scrollTop = container.scrollHeight;

                sessions[currentSessionId].messages.push({ role: 'assistant', content: data.response });
                localStorage.setItem('aura_sessions', JSON.stringify(sessions));

            } catch (err) {
                console.error(err);
            }
        }

        // Initialize history on load
        renderHistoryList();
    </script>
</body>
</html>
